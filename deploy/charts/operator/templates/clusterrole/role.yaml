{{- if eq .Values.operator.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toolhive-operator-manager-role
rules:
{{- include "toolhive.operator.managerRules" . | nindent 0 }}
{{- include "toolhive.operator.crdRules" . | nindent 0 }}
{{- else }}
{{- range .Values.operator.rbac.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toolhive-operator-manager-role
  namespace: {{ . }}
rules:
{{- include "toolhive.operator.managerRules" $ | nindent 0 }}
{{- end }}
{{- end }}
