#
# This workflow builds distributable Claude Code Agent Skills from skills/
# and publishes them as signed OCI artifacts to GHCR.
#
# Deliberately separate from skills-build.yml, which performs the same build
# for verification on pull requests and main. This one holds id-token: write
# so `thv skill push` can sign keylessly, and it runs repository code
# (`thv serve`, `thv skill build`) to do so — so it must only ever be called
# from a trusted, post-merge context. releaser.yml is its sole caller; adding
# a pull-request-triggered one would hand OIDC signing capability to code
# from the pull request under review.

name: Publish Skills

on:
  workflow_call:

jobs:
  skills-publish:
    name: Publish Skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets `thv skill push` mint the ambient OIDC token it signs with. A
      # reusable workflow cannot be granted more than its caller declares, so
      # the calling job needs this too (releaser.yml's skills-publish).
      id-token: write

    env:
      BASE_REPO: "ghcr.io/stacklok/toolhive/skills"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'

      - name: Compute version number
        id: version-string
        uses: ./.github/actions/compute-version

      - name: Build thv binary
        run: go build -o ./thv ./cmd/thv

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start thv serve
        run: |
          ./thv serve --host 127.0.0.1 --port 8080 > /tmp/thv-serve.log 2>&1 &
          echo "THV_PID=$!" >> "$GITHUB_ENV"

          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "thv serve is ready (PID: $!)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "thv serve failed to start after 30s; logs:"
              cat /tmp/thv-serve.log
              exit 1
            fi
            sleep 1
          done

          # Verify process is still alive after health check
          kill -0 "$!" 2>/dev/null || { echo "thv serve exited unexpectedly; logs:"; cat /tmp/thv-serve.log; exit 1; }

      - name: Build and publish skills
        env:
          TAG: ${{ steps.version-string.outputs.tag }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          for skill_dir in skills/*/; do
            # Skip if no skills exist
            [ -d "$skill_dir" ] || continue

            skill_name=$(basename "$skill_dir")
            ref="${BASE_REPO}/${skill_name}:${TAG}"

            echo "Building skill: ${skill_name} -> ${ref}"
            built_ref=$(./thv skill build "$skill_dir" --tag "$ref")
            echo "Built: ${built_ref}"

            echo "Pushing skill: ${built_ref}"
            # No signing flags: with id-token:write granted, the push acquires
            # the job's ambient OIDC token and signs keylessly against Fulcio
            # and Rekor. Absent that token the push fails rather than
            # publishing unsigned.
            ./thv skill push "$built_ref"

            # Also tag as latest when building from a release tag
            if [[ "$GH_REF" == refs/tags/* ]]; then
              latest_ref="${BASE_REPO}/${skill_name}:latest"
              echo "Tagging as latest: ${latest_ref}"
              built_latest=$(./thv skill build "$skill_dir" --tag "$latest_ref")
              ./thv skill push "$built_latest"
            fi

            echo "Published: ${ref}"
          done

      - name: Stop thv serve
        if: always()
        run: kill "$THV_PID" 2>/dev/null || true
