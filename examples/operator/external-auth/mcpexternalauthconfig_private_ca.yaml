# Embedded auth server using a private CA for its OIDC upstream and for a
# trusted issuer's discovery/JWKS endpoint.
# Replace the placeholder certificate with the PEM-encoded CA certificate.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-private-ca
  namespace: default
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    replace-with-your-private-ca-certificate
    -----END CERTIFICATE-----

---
apiVersion: v1
kind: Secret
metadata:
  name: reporting-delegate-secret
  namespace: default
type: Opaque
stringData:
  client-secret: replace-with-your-delegate-client-secret

---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: private-ca-auth-server
  namespace: default
spec:
  type: embeddedAuthServer
  embeddedAuthServer:
    issuer: https://auth.example.com
    upstreamProviders:
      - name: corporate-idp
        type: oidc
        oidcConfig:
          issuerUrl: https://idp.internal.example.com
          clientId: toolhive-client
          caBundleRef:
            configMapRef:
              name: upstream-private-ca
              key: ca.crt
    # reporting-delegate is declared here and referenced by name below in
    # trustedIssuers.allowedDelegateClients - the two lists are independent
    # (a declaration vs. an allowlist) but share clientId to wire together.
    delegateClients:
      - clientId: reporting-delegate
        clientSecretRef:
          name: reporting-delegate-secret
          key: client-secret
        scopes: [openid]
        audiences: [https://mcp.example.com]
    trustedIssuers:
      - issuerUrl: https://issuer.internal.example.com
        expectedAudience: toolhive-authserver
        allowedDelegateClients:
          - reporting-delegate
        allowedActors:
          - external-reporting-client
        caBundleRef:
          configMapRef:
            name: upstream-private-ca
            key: ca.crt
