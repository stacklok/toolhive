# -- Override the chart name used in resource labels and generated names.
nameOverride: ""
# -- Override the generated name of the operator Deployment and related
# resources.
fullnameOverride: "toolhive-operator"

# -- Settings for the operator Deployment and related resources.
operator:
  features:
    # -- Enable experimental operator features.
    experimental: false
    # -- Enable the storage version migration controller to rewrite resources in
    # the current storage version and remove obsolete entries from CRD
    # `status.storedVersions`. Applies to ToolHive CRDs with the
    # `toolhive.stacklok.dev/auto-migrate-storage-version` label set to
    # `"true"`. Requires `operator.rbac.scope=cluster`; set this to `false`
    # for namespace-scoped installations.
    storageVersionMigrator: true
  # -- Number of operator replicas when autoscaling is disabled. Leader election
  # selects one active controller replica.
  replicaCount: 1

  # -- Image pull Secrets for the operator pod, as objects with a `name` field.
  # Secrets must exist in the release namespace.
  imagePullSecrets: []

  # -- Default image pull Secrets for workloads created by the operator. Accepts
  # Secret names or objects with a `name` field. Entries are merged with each
  # resource's `imagePullSecrets`, with resource-level entries taking
  # precedence for duplicate names. Secrets must exist in each workload's
  # namespace.
  defaultImagePullSecrets: []

  # -- Default Redis or Valkey session storage settings for workloads without
  # `spec.sessionStorage` configured.
  defaultRedis:
    # -- Redis or Valkey address in `host:port` format. When empty, uses
    # `global.redis.host` and `global.redis.port` (default `6379`) from a
    # parent chart. No default session storage is configured when neither
    # address is set.
    addr: ""
    # -- Name of an existing Secret containing the Redis password. When empty,
    # uses `global.redis.existingSecret`. The Secret must exist in each
    # workload's namespace. Used only when a Redis address is configured.
    existingSecret: ""
    # -- Key containing the password in `existingSecret`. When empty, uses
    # `global.redis.existingSecretKey`, then `redis-password`.
    existingSecretKey: ""

  # -- Container image for the operator.
  image: ghcr.io/stacklok/toolhive/operator:v0.51.4
  # -- Image pull policy for the operator container and image-discovery
  # containers.
  imagePullPolicy: IfNotPresent

  # -- Container image for ToolHive proxy runners created by the operator.
  toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner:v0.51.4

  # -- Container image for Virtual MCP Server (vMCP) deployments created by the
  # operator.
  vmcpImage: ghcr.io/stacklok/toolhive/vmcp:v0.51.4

  # -- Image discovery settings for manifest scanners used to mirror images into
  # air-gapped environments.
  imageDiscovery:
    # -- Render a zero-replica Deployment with `image:` entries for
    # `operator.toolhiveRunnerImage`, `operator.vmcpImage`, and
    # `registryAPI.image`. This lets manifest scanners discover images
    # otherwise supplied to the operator through environment variables. The
    # Deployment runs no pods.
    enabled: false
    # -- Resource requests and limits for image-discovery containers. Admission
    # policies can require these values even when the Deployment has zero
    # replicas.
    resources: {}

  # -- Bind address for proxy runners in managed MCPServer and MCPRemoteProxy
  # workloads.
  proxyHost: 0.0.0.0

  # -- Additional environment variables for the operator container.
  # Chart-managed variables take precedence for duplicate names. Set
  # `TOOLHIVE_SKIP_UPDATE_CHECK` to `"true"` to disable periodic update
  # checks and the usage metrics collected with them.
  env: []

  # -- Ports declared on the operator container. The default `metrics` and
  # `health` names identify the metrics and health-check ports.
  ports:
  - containerPort: 8080
    name: metrics
    protocol: TCP
  - containerPort: 8081
    name: health
    protocol: TCP

  # -- Annotations to add to the operator pod.
  podAnnotations: {}
  # -- Labels to add to the operator pod.
  podLabels: {}

  # -- Security context for the operator pod and image-discovery pod template.
  podSecurityContext:
    runAsNonRoot: true

  # -- Security context for the operator container and image-discovery
  # containers.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault

  # -- Liveness probe for the operator container. The default probe uses the
  # named `health` port.
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  # -- Readiness probe for the operator container. The default probe uses the
  # named `health` port.
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Horizontal Pod Autoscaler settings for the operator Deployment.
  autoscaling:
    # -- Create a Horizontal Pod Autoscaler for the operator Deployment. When
    # enabled, the chart omits `replicaCount` from the Deployment.
    enabled: false
    # -- Minimum number of operator replicas when autoscaling is enabled.
    minReplicas: 1
    # -- Maximum number of operator replicas when autoscaling is enabled.
    maxReplicas: 100
    # -- Target average CPU utilization as a percentage of requested CPU for
    # autoscaling.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization as a percentage of requested memory
    # for autoscaling. Uncomment to enable.
    # targetMemoryUtilizationPercentage: 80

  # -- Resource requests and limits for the operator container.
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Go runtime memory and garbage collection settings for the operator
  # container.
  gc:
    # -- Go runtime soft memory limit, supplied as `GOMEMLIMIT`.
    gomemlimit: 110MiB
    # -- Target heap growth percentage between garbage collections, supplied as
    # `GOGC`. The Go runtime default is `100`.
    gogc: 75  # 75% heap growth before garbage collection

  # -- Role-based access control (RBAC) settings for the operator.
  rbac:
    # -- Permission scope for the operator. `cluster` creates a
    # ClusterRoleBinding for cluster-wide access. `namespace` creates a
    # RoleBinding to the operator ClusterRole in each entry of
    # `allowedNamespaces` and limits watches to those namespaces. Namespace
    # scope requires `operator.features.storageVersionMigrator=false`.
    scope: cluster
    # -- Namespaces to watch and manage when `scope` is `namespace`. Each
    # namespace receives a RoleBinding to the operator ClusterRole.
    allowedNamespaces: []

  # -- ServiceAccount settings for the operator.
  serviceAccount:
    # -- Create the operator ServiceAccount.
    create: true
    # -- Automatically mount Kubernetes API credentials for pods using the
    # chart-created ServiceAccount. Used only when `create` is `true`.
    automountServiceAccountToken: true
    # -- Annotations to add to the chart-created ServiceAccount.
    annotations: {}
    # -- Labels to add to the chart-created ServiceAccount.
    labels: {}
    # -- Name of the ServiceAccount used by the operator. When empty, uses the
    # generated resource name if `create` is `true`, or the namespace's
    # `default` ServiceAccount if `create` is `false`.
    name: "toolhive-operator"

  # -- Namespaced Role and RoleBinding settings for operator leader election.
  leaderElectionRole:
    # -- Name of the Role used for operator leader election.
    name: toolhive-operator-leader-election-role
    binding:
      # -- Name of the RoleBinding used for operator leader election.
      name: toolhive-operator-leader-election-rolebinding
    # -- Permission rules for the operator leader election Role.
    rules:
    - apiGroups:
      - ""
      resources:
      - configmaps
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - events.k8s.io
      resources:
      - events
      verbs:
      - create
      - patch

  # -- Additional volumes for the operator pod.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volume mounts for the operator container.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Node selector for scheduling the operator pod.
  nodeSelector: {}

  # -- Tolerations for scheduling the operator pod.
  tolerations: []

  # -- Affinity rules for scheduling the operator pod.
  affinity: {}

# -- Settings for the registry API workloads created by the operator.
registryAPI:
  # -- Container image for registry API workloads created by the operator.
  image: "ghcr.io/stacklok/thv-registry-api:v1.5.2"
