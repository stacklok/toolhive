name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Claude Code Action
    # Security: only allow invocation by trusted contributors.
    #
    # This is an allow-list rather than a deny-list. Denying NONE, FIRST_TIMER
    # and FIRST_TIME_CONTRIBUTOR still admitted CONTRIBUTOR — which anyone
    # earns permanently by getting a single pull request merged — and
    # MANNEQUIN. This job holds contents: write and ANTHROPIC_API_KEY and
    # allows Bash(git *), so the bar needs to be write access to the
    # repository, not a history of contributing to it.
    #
    # Same pattern as the /retest gate in retest.yaml.
    # See: https://docs.github.com/en/graphql/reference/enums#commentauthorassociation
    if: >-
      ${{
        (github.event_name == 'issue_comment'
          && contains(github.event.comment.body, '@claude')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.comment.author_association))
        || (github.event_name == 'pull_request_review_comment'
          && contains(github.event.comment.body, '@claude')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.comment.author_association))
        || (github.event_name == 'pull_request_review'
          && contains(github.event.review.body, '@claude')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.review.author_association))
        || (github.event_name == 'issues'
          && contains(github.event.issue.body, '@claude')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.issue.author_association))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least-privilege permissions for the AI agent workflow.
    # contents:write is required for Claude to push commits on PRs.
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Unlike every other checkout in this repository, this one keeps its
      # credentials on purpose. The job holds contents: write precisely so
      # Claude can push commits to a pull request, and that push uses the
      # credential actions/checkout leaves in .git/config. Setting
      # persist-credentials: false here would break the action.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6   # zizmor: ignore[artipacked]
        with:
          fetch-depth: 1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'

      - name: Setup helm-docs
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac # v1.0.205
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Security: Restrict tools to prevent arbitrary code execution.
          # Bash is scoped to known-safe commands (task, go, git, helm-docs).
          # No unrestricted Bash access — prevents prompt injection from
          # executing arbitrary shell commands via crafted issue/PR content.
          allowed_tools: "Read,Edit,Write,Glob,Grep,Bash(task *),Bash(go *),Bash(git *),Bash(helm-docs *),mcp__github__*"
