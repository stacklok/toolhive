# These set of workflows run on every push to the main branch
name: Main build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  linting:
    name: Linting
    uses: ./.github/workflows/lint.yml
  security-scan:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    # Named rather than inherited: this job runs the Go test suite, and so
    # executes repository code and its dependency tree. It has no business
    # holding the release signing keys.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  codegen:
    name: Codegen
    uses: ./.github/workflows/verify-gen.yml
  # Tier 2: Expensive integration tests - only run after all fast checks pass
  helm-charts:
    name: Helm Charts
    uses: ./.github/workflows/helm-charts-test.yml
  e2e-tests:
    name: E2E Tests
    needs: [linting, tests, codegen]
    uses: ./.github/workflows/e2e-tests.yml
  operator-ci:
    name: Operator CI
    needs: [linting, tests, codegen]
    permissions:
      contents: read
    uses: ./.github/workflows/operator-ci.yml
  # Tier 3: Build and publish images - only after all tests pass
  image-build-and-push:
    name: Build and Sign Image
    needs: [linting, security-scan, tests, e2e-tests, codegen, operator-ci]
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/image-build-and-publish.yml
  skills-build-and-push:
    name: Build and Publish Skills
    needs: [linting, tests, codegen]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/skills-build-and-publish.yml
  skills-keyless-e2e:
    name: Skills Keyless Signing E2E (staging)
    needs: [linting, tests, codegen]
    # Informational, not a merge gate: it signs against Sigstore's public
    # staging instance, whose outages this repository does not control. The
    # continue-on-error that makes it non-blocking lives on the called
    # workflow's own job — GitHub rejects that key on a job that uses `uses:`.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/skills-keyless-signing-e2e.yml
