apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toolhive-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolhive-operator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.operator.autoscaling.enabled }}
  replicas: {{ .Values.operator.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "toolhive-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "toolhive-operator.labels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "toolhive-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.operator.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.operator.image }}"
          imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
          args:
          - --leader-elect
          ports:
            {{- toYaml .Values.operator.ports | nindent 12 }}
          env:
          {{- /*
            User-supplied env entries are rendered first so that chart-managed
            env vars below win on name collision: Kubernetes keeps the last
            entry when a name appears more than once on the container. This
            prevents an accidental `operator.env` override of reserved names
            like TOOLHIVE_DEFAULT_IMAGE_PULL_SECRETS or TOOLHIVE_RUNNER_IMAGE.
          */}}
          {{- with .Values.operator.env }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          - name: GOMEMLIMIT
            value: {{ .Values.operator.gc.gomemlimit | quote }}
          - name: GOGC
            value: {{ .Values.operator.gc.gogc | quote }}
          # Always use structured JSON logs in Kubernetes (not configurable)
          - name: UNSTRUCTURED_LOGS
            value: "false"
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: TOOLHIVE_USE_CONFIGMAP
            value: "true"
          - name: ENABLE_EXPERIMENTAL_FEATURES
            value: {{ .Values.operator.features.experimental | quote }}
          - name: TOOLHIVE_ENABLE_STORAGE_VERSION_MIGRATOR
            value: {{ .Values.operator.features.storageVersionMigrator | quote }}
          {{- if eq .Values.operator.rbac.scope "namespace" }}
          - name: WATCH_NAMESPACE
            value: "{{ .Values.operator.rbac.allowedNamespaces | join "," }}"
          {{- end }}
          - name: TOOLHIVE_RUNNER_IMAGE
            value: "{{ .Values.operator.toolhiveRunnerImage }}"
          - name: VMCP_IMAGE
            value: "{{ .Values.operator.vmcpImage }}"
          - name: TOOLHIVE_PROXY_HOST
            value: "{{ .Values.operator.proxyHost }}"
          - name: TOOLHIVE_REGISTRY_API_IMAGE
            value: "{{ .Values.registryAPI.image }}"
          {{- with .Values.operator.defaultImagePullSecrets }}
          {{- /*
            Accept both shapes per values.yaml documentation:
              - plain strings: ["regcred", "otherscred"]
              - objects with a `name` field: [{name: regcred}, {name: otherscred}]
            The object form mirrors `operator.imagePullSecrets` above so users
            can copy that pattern without silent breakage. Anything else (numbers,
            nested lists, objects without `name`) fails the template render with
            a clear message instead of producing an env var like
            `TOOLHIVE_DEFAULT_IMAGE_PULL_SECRETS=map[name:foo]`.
          */}}
          {{- $names := list }}
          {{- range $i, $entry := . }}
          {{- if kindIs "string" $entry }}
          {{- $names = append $names $entry }}
          {{- else if kindIs "map" $entry }}
          {{- if not $entry.name }}
          {{- fail (printf "operator.defaultImagePullSecrets[%d]: object entry must have a non-empty `name` field" $i) }}
          {{- end }}
          {{- $names = append $names $entry.name }}
          {{- else }}
          {{- fail (printf "operator.defaultImagePullSecrets[%d]: entry must be a string or an object with a `name` field, got %s" $i (kindOf $entry)) }}
          {{- end }}
          {{- end }}
          - name: TOOLHIVE_DEFAULT_IMAGE_PULL_SECRETS
            value: {{ join "," $names | quote }}
          {{- end }}
          {{- /*
            Global Redis defaults — injected only when an address is configured.
            operator.defaultRedis.addr takes precedence over global.redis.host:port.
            The password is sourced from a Secret via secretKeyRef so it never
            appears in the operator process env in plaintext.
          */}}
          {{- $rdAddr := .Values.operator.defaultRedis.addr }}
          {{- if not $rdAddr }}
            {{- $gh := (((.Values.global).redis).host) }}
            {{- if $gh }}
              {{- $gp := (((.Values.global).redis).port | default 6379) }}
              {{- $rdAddr = printf "%s:%v" $gh $gp }}
            {{- end }}
          {{- end }}
          {{- $rdTLS := .Values.operator.defaultRedis.tls }}
          {{- if kindIs "invalid" $rdTLS }}
            {{- $rdTLS = dict }}
          {{- end }}
          {{- if not (kindIs "map" $rdTLS) }}
            {{- fail "operator.defaultRedis.tls must be an object" }}
          {{- end }}
          {{- range $field := keys $rdTLS }}
            {{- if not (has $field (list "enabled" "caCertSecretRef")) }}
              {{- fail (printf "operator.defaultRedis.tls.%s is unsupported" $field) }}
            {{- end }}
          {{- end }}
          {{- $tlsEnabled := get $rdTLS "enabled" }}
          {{- if and (hasKey $rdTLS "enabled") (not (kindIs "bool" $tlsEnabled)) }}
            {{- fail "operator.defaultRedis.tls.enabled must be a boolean" }}
          {{- end }}
          {{- $caRef := get $rdTLS "caCertSecretRef" }}
          {{- if or (not (hasKey $rdTLS "caCertSecretRef")) (kindIs "invalid" $caRef) }}
            {{- $caRef = dict }}
          {{- end }}
          {{- if not (kindIs "map" $caRef) }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef must be an object" }}
          {{- end }}
          {{- range $field := keys $caRef }}
            {{- if not (has $field (list "name" "key")) }}
              {{- fail (printf "operator.defaultRedis.tls.caCertSecretRef.%s is unsupported" $field) }}
            {{- end }}
          {{- end }}
          {{- $caName := get $caRef "name" }}
          {{- $caKey := get $caRef "key" | default "ca.crt" }}
          {{- if and (hasKey $caRef "name") (not (kindIs "string" $caName)) }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef.name must be a string" }}
          {{- end }}
          {{- if and (hasKey $caRef "key") (not (kindIs "string" (get $caRef "key"))) }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef.key must be a string" }}
          {{- end }}
          {{- if and $caName (not $tlsEnabled) }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef.name requires operator.defaultRedis.tls.enabled=true" }}
          {{- end }}
          {{- if and $caName (not (get $caRef "key")) }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef.key must be non-empty when name is set" }}
          {{- end }}
          {{- if and (not $caName) (ne $caKey "ca.crt") }}
            {{- fail "operator.defaultRedis.tls.caCertSecretRef.key requires a Secret name" }}
          {{- end }}
          {{- if and $tlsEnabled (not $rdAddr) }}
            {{- fail "operator.defaultRedis.tls.enabled requires operator.defaultRedis.addr or global.redis.host" }}
          {{- end }}
          {{- if $rdAddr }}
          - name: TOOLHIVE_DEFAULT_REDIS_ADDR
            value: {{ $rdAddr | quote }}
          {{- $rdSecret := .Values.operator.defaultRedis.existingSecret | default (((.Values.global).redis).existingSecret) }}
          {{- if $rdSecret }}
          {{- $rdKey := .Values.operator.defaultRedis.existingSecretKey | default ((((.Values.global).redis).existingSecretKey) | default "redis-password") }}
          - name: TOOLHIVE_DEFAULT_REDIS_SECRET_NAME
            value: {{ $rdSecret | quote }}
          - name: TOOLHIVE_DEFAULT_REDIS_SECRET_KEY
            value: {{ $rdKey | quote }}
          {{- end }}
          {{- if $tlsEnabled }}
          - name: TOOLHIVE_DEFAULT_REDIS_TLS_ENABLED
            value: "true"
          {{- if $caName }}
          - name: TOOLHIVE_DEFAULT_REDIS_TLS_CA_SECRET_NAME
            value: {{ $caName | quote }}
          - name: TOOLHIVE_DEFAULT_REDIS_TLS_CA_SECRET_KEY
            value: {{ $caKey | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.operator.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.operator.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- with .Values.operator.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
