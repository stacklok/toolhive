spec:
  group: toolhive.stacklok.dev
  names:
    categories:
    - toolhive
    kind: MCPRemoteProxy
    listKind: MCPRemoteProxyList
    plural: mcpremoteproxies
    shortNames:
    - rp
    - mcprp
    singular: mcpremoteproxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
