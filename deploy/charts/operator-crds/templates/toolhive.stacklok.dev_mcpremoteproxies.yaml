                    items:
                      description: HeaderFromSecret defines a header whose value comes
                        from a Kubernetes Secret.
                      properties:
                        headerName:
                          description: HeaderName is the HTTP header name (e.g., "X-API-Key")
                          maxLength: 255
                          minLength: 1
                          type: string
                        valueSecretRef:
                          description: ValueSecretRef references the Secret and key
                            containing the header value
                          properties:
                            key:
                              description: Key is the key within the secret
                              type: string
                            name:
                              description: Name is the name of the secret
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - headerName
                      - valueSecretRef
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - headerName
                    x-kubernetes-list-type: map
                  addPlaintextHeaders:
                    additionalProperties:
                      type: string
                    description: |-
                      AddPlaintextHeaders is a map of header names to literal values to inject into requests.
                      WARNING: Values are stored in plaintext and visible via kubectl commands.
                      Use addHeadersFromSecret for sensitive data like API keys or tokens.
                    type: object
                type: object
              oidcConfigRef:
                description: |-
                  OIDCConfigRef references a shared MCPOIDCConfig resource for OIDC authentication.
                  The referenced MCPOIDCConfig must exist in the same namespace as this MCPRemoteProxy.
                  Per-server overrides (audience, scopes) are specified here; shared provider config
                  lives in the MCPOIDCConfig resource.

                  SECURITY: if this field is omitted and no other authentication source is configured,
                  the proxy runs UNAUTHENTICATED. It accepts every request that can reach its port and
                  forwards it to the remote MCP server under a synthetic local-user identity, with no
                  token or credential check. Set this field to enforce identity-based access control
                  per request.
                properties:
                  audience:
                    description: |-
                      Audience is the expected audience for token validation.
                      This MUST be unique per server to prevent token replay attacks.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the MCPOIDCConfig resource
                    minLength: 1
                    type: string
                  resourceUrl:
                    description: |-
                      ResourceURL is the public URL for OAuth protected resource metadata (RFC 9728).
                      When the server is exposed via Ingress or gateway, set this to the external
                      URL that MCP clients connect to. If not specified, defaults to the internal
                      Kubernetes service URL.
                    type: string
                  scopes:
                    description: |-
                      Scopes is the list of OAuth scopes to advertise in the well-known endpoint (RFC 9728).
                      If empty, defaults to ["openid"].
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - audience
                - name
                type: object
              podTemplateSpec:
                description: |-
                  PodTemplateSpec defines the pod template to use for the MCPRemoteProxy
                  This allows for customizing the pod configuration beyond what is provided by the other fields.
                  Note that to modify the specific container the remote proxy runs in, you must specify
                  the `toolhive` container name in the PodTemplateSpec.
                  This field accepts a PodTemplateSpec object as JSON/YAML.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              proxyPort:
                default: 8080
                description: ProxyPort is the port to expose the MCP proxy on
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              remoteUrl:
                description: RemoteURL is the URL of the remote MCP server to proxy
                pattern: ^https?://
                type: string
              replicas:
                description: |-
                  Replicas is the desired number of proxy pod replicas.
                  MCPRemoteProxy creates a single Deployment for the proxy process, so there
                  is only one replicas field (mirrors VirtualMCPServer.spec.replicas).
                  When nil, the operator does not set Deployment.Spec.Replicas, leaving replica
                  management to an HPA or other external controller.
                  When set above 1, also configure sessionStorage with the redis provider and
                  sessionAffinity: "None" so sessions resolve across replicas; otherwise a
                  SessionStorageWarning condition is surfaced on the resource status.
                format: int32
                minimum: 0
                type: integer
              resourceOverrides:
                description: ResourceOverrides allows overriding annotations and labels
