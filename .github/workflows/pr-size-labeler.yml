name: PR Size Labeler - Calculate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  calculate-pr-size:
    name: Calculate PR Size
    runs-on: ubuntu-slim
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.data.additions;
            const deletions = pr.data.deletions;
            const totalChanges = additions + deletions;

            console.log(`PR #${context.issue.number}: +${additions} -${deletions} (${totalChanges} total)`);

            return {
              additions: additions,
              deletions: deletions,
              total: totalChanges
            };

      - name: Determine size label
        id: size
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_RESULT: ${{ steps.pr.outputs.result }}
        with:
          script: |
            const changes = JSON.parse(process.env.PR_RESULT);
            const total = changes.total;

            let sizeLabel = '';

            if (total < 100) {
              sizeLabel = 'size/XS';
            } else if (total < 300) {
              sizeLabel = 'size/S';
            } else if (total < 600) {
              sizeLabel = 'size/M';
            } else if (total < 1000) {
              sizeLabel = 'size/L';
            } else {
              sizeLabel = 'size/XL';
            }

            console.log(`PR size: ${total} lines -> ${sizeLabel}`);
            return sizeLabel;

      # Only the label goes in the artifact. The PR number is derived by the
      # consumer from its own trigger event: this workflow runs on
      # `pull_request`, so a pull request from a fork supplies the definition
      # that produces these files, and nothing in them can be trusted to say
      # which pull request to act on.
      - name: Save size label to artifact
        env:
          SIZE_LABEL: ${{ steps.size.outputs.result }}
        run: |
          mkdir -p pr-size
          echo "$SIZE_LABEL" > pr-size/label.txt

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-size-label
          path: pr-size/
          retention-days: 1