name: PR Size Labeler - Calculate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel superseded PR runs; keep other events independent.
concurrency:
  group: pr-size-labeler-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calculate-pr-size:
    name: Calculate PR Size
    runs-on: ubuntu-slim
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.data.additions;
            const deletions = pr.data.deletions;
            const totalChanges = additions + deletions;

            console.log(`PR #${context.issue.number}: +${additions} -${deletions} (${totalChanges} total)`);

            return {
              additions: additions,
              deletions: deletions,
              total: totalChanges
            };

      - name: Determine size label
        id: size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_RESULT: ${{ steps.pr.outputs.result }}
        with:
          script: |
            const changes = JSON.parse(process.env.PR_RESULT);
            const total = changes.total;

            let sizeLabel = '';

            if (total < 100) {
              sizeLabel = 'size/XS';
            } else if (total < 300) {
              sizeLabel = 'size/S';
            } else if (total < 600) {
              sizeLabel = 'size/M';
            } else if (total < 1000) {
              sizeLabel = 'size/L';
            } else {
              sizeLabel = 'size/XL';
            }

            console.log(`PR size: ${total} lines -> ${sizeLabel}`);
            return sizeLabel;

      # This workflow runs on `pull_request`, so a pull request — including one
      # from a fork — supplies the definition that produces these files.
      # Nothing in them can be trusted to say which pull request to act on, so
      # the consumer derives the number from its own trigger event instead, so
      # the label is the only thing that needs to cross the boundary.
      - name: Save size label to artifact
        env:
          SIZE_LABEL: ${{ steps.size.outputs.result }}
        run: |
          mkdir -p pr-size
          echo "$SIZE_LABEL" > pr-size/label.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-size-label
          path: pr-size/
          retention-days: 1