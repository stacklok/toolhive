name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build ToolHive Binary
    # The org-level pool is for trusted code only. Fork pull requests run on a
    # GitHub-hosted runner so untrusted code cannot reach self-hosted infrastructure.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'stacklok-self-hosted-runners' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ToolHive binary
        run: |
          task build
          # Verify the binary was created and is executable
          ls -la ./bin/
          chmod +x ./bin/thv

      - name: Upload ToolHive binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolhive-binary
          path: ./bin/thv
          retention-days: 1

  e2e-tests-core:
    name: E2E Tests Core (${{ matrix.title }})
    # Trusted branches use the arm64 self-hosted pool. Fork pull requests use
    # GitHub-hosted runners so untrusted code cannot reach internal infrastructure.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'stacklok-self-hosted-runners' || 'ubuntu-latest' }}
    needs: build-binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: core
            label_filter: core
            artifact: e2e-test-results-core
            procs: 4
          - title: mcp-run
            label_filter: mcp-run
            artifact: e2e-test-results-mcp-run
          - title: mcp-protocol
            label_filter: mcp-protocol
            artifact: e2e-test-results-mcp-protocol
          - title: proxy
            label_filter: "proxy && !isolation"
            artifact: e2e-test-results-proxy
          - title: network-isolation
            label_filter: isolation
            artifact: e2e-test-results-network-isolation
            test_timeout: 25m
          - title: middleware
            label_filter: 'middleware || stability'
            artifact: e2e-test-results-middleware
          - title: api-registry
            label_filter: api-registry
            artifact: e2e-test-results-api-registry
          - title: api-workloads
            label_filter: "api-workloads && !lifecycle"
            artifact: e2e-test-results-api-workloads
            test_timeout: 25m
          - title: api-workloads-lifecycle
            label_filter: "api-workloads && lifecycle"
            artifact: e2e-test-results-api-workloads-lifecycle
            test_timeout: 25m
          - title: api-clients
            label_filter: api-clients
            artifact: e2e-test-results-api-clients
          - title: api-misc
            label_filter: api-misc
            artifact: e2e-test-results-api-misc
          - title: vmcp
            label_filter: vmcp
            artifact: e2e-test-results-vmcp
          - title: llm
            label_filter: llm
            artifact: e2e-test-results-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
      - name: Install Ginkgo CLI
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.28.1

      - name: Download ToolHive binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolhive-binary
          path: ./bin/

      - name: Set binary permissions
        run: |
          chmod +x ./bin/thv
          ls -la ./bin/

      - name: Verify container runtime (Docker)
        run: docker version

      - name: Pre-pull container images
        run: |
          # Pre-pull images used by E2E tests so that workload startup does not
          # pay the image-pull cost inside a spec's readiness timeout.
          #
          # Images that tests reach through a registry server name (`thv run
          # fetch`) are resolved from the binary under test instead of being
          # hardcoded here. Renovate bumps github.com/stacklok/toolhive-catalog
          # daily but has no manager for these docker pull lines, so hardcoded
          # tags drift out of sync with the catalog silently and the pre-pull
          # stops covering what the tests actually run.
          servers="fetch osv"
          images="ghcr.io/stacklok/toolhive/egress-proxy:latest"
          # yardstick is only needed for the vmcp test suite
          if [ "${{ matrix.label_filter }}" = "vmcp" ]; then
            images="$images ghcr.io/stackloklabs/yardstick/yardstick-server:1.2.0"
          fi
          # the time server and yardstick (dual-era barrier mode) are only
          # used by the proxy (streamable-http) test suite
          if [ "${{ matrix.label_filter }}" = "proxy && !isolation" ]; then
            servers="$servers time"
            images="$images ghcr.io/stackloklabs/yardstick/yardstick-server:1.2.0"
          fi
          # Envoy is only used by the network-isolation test suite
          if [ "${{ matrix.title }}" = "network-isolation" ]; then
            images="$images envoyproxy/envoy-distroless:v1.32.3"
          fi

          for server in $servers; do
            image="$(./bin/thv registry info "$server" --format json | jq -er '.image')"
            echo "Resolved registry server '$server' -> $image"
            images="$images $image"
          done

          for image in $images; do
            docker pull -q "$image" &
          done
          wait

          # `wait` reports success even when a background pull failed, so check
          # each image landed locally. Failing here is far cheaper to diagnose
          # than a spec timing out later while it waits on a live pull.
          echo "Pre-pulled images:"
          for image in $images; do
            docker image inspect "$image" >/dev/null \
              || { echo "::error::failed to pre-pull $image"; exit 1; }
            echo "  $image"
          done

      - name: Run E2E tests (${{ matrix.title }})
        env:
          THV_BINARY: ${{ github.workspace }}/bin/thv
          TOOLHIVE_EGRESS_IMAGE: ghcr.io/stacklok/toolhive/egress-proxy:latest
          TEST_TIMEOUT: ${{ matrix.test_timeout || '15m' }}
          LABEL_FILTER: ${{ matrix.label_filter }}
          PROCS: ${{ matrix.procs || 1 }}
        run: ./test/e2e/run_tests.sh

      - name: Upload test results (${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            test/e2e/junit-report.xml
          retention-days: 7

  conformance:
    name: MCP Conformance
    # Keep this on the same architecture as build-binary: its artifact is a
    # native executable. Fork pull requests remain on GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'stacklok-self-hosted-runners' || 'ubuntu-latest' }}
    needs: build-binary
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [proxy, vmcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download ToolHive binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: toolhive-binary
          path: ./bin/

      - name: Set binary permissions
        run: chmod +x ./bin/thv

      - name: Verify container runtime (Docker)
        run: docker version

      - name: Run MCP conformance suite
        env:
          THV_BINARY: ${{ github.workspace }}/bin/thv
          CONFORMANCE_TARGET: ${{ matrix.target }}
        run: ./test/conformance/run-conformance.sh

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results-${{ matrix.target }}
          path: test/conformance/results
          retention-days: 7
